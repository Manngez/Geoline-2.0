name: JavaScript syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          for file in app-core.js app-map.js app-game.js settlement-filter.js app-online.js app-classroom.js state-capitals.js game-ui.js app.js; do
            node --check "$file"
          done
